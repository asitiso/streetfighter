<!doctype html><html lang="ko"><meta charset="utf-8"><title>Combat impact asset QA</title><style>body{margin:0;background:#101522;color:#eef4ff;font:15px system-ui}header{padding:16px 24px;display:flex;gap:24px;align-items:center}h1{font-size:20px;margin:0}small{color:#a3b5cf}button,a{color:#c5f2ff;background:#1c2b43;border:1px solid #405979;padding:7px 12px;border-radius:6px}canvas{display:block;width:min(1280px,100vw);height:auto}#status{margin-left:auto}</style><header><h1>COMBAT IMPACT</h1><small>새 원본 16프레임 · 실제 게임 렌더러</small><button id="play">재생</button><small id="status">Loading…</small></header><canvas width="1280" height="880"></canvas><script type="module">
import{drawCombatImpact}from'/assets/render/CombatImpactAssets.js';import{drawCombatFighter}from'/assets/render/Visuals.js';import{Fighter}from'/assets/combat/Fighter.js';import{getCharacter}from'/assets/game/characters.js';import{preloadArtAssets,isArtAssetReady}from'/assets/render/ImageAssets.js';import{characterTextureManager}from'/assets/render/CharacterTextureManager.js';import{runtimeQuality}from'/assets/core/RuntimeQuality.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');runtimeQuality.setTier('high');characterTextureManager.setMode('hd');characterTextureManager.focusCharacter('KEN','RYU');for(const id of ['KEN','RYU'])characterTextureManager.preloadCharacter(id);preloadArtAssets(['combat-impact-atlas','sprite-ken','sprite-ryu']);
const rows=[['hit','HIT · 타격',16],['block','GUARD · 가드',16],['parry','PARRY · 패링',24],['counter','COUNTER · 카운터',16]],fighters=[];for(let i=0;i<16;i++)fighters.push([new Fighter(getCharacter('KEN'),'player',150,285,1),new Fighter(getCharacter('RYU'),'enemy',350,285,-1)]);
let playing=false,start=performance.now();document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'정지':'재생';start=performance.now();};
function render(now){ctx.fillStyle='#101522';ctx.fillRect(0,0,1280,880);let total=0;for(let r=0;r<4;r++)for(let col=0;col<4;col++){const x=col*320,y=r*220;ctx.fillStyle=(r+col)%2?'#172033':'#1b263a';ctx.fillRect(x+1,y+1,318,218);ctx.fillStyle='#cbd8ea';ctx.font='bold 13px system-ui';ctx.fillText(rows[r][1]+' / '+(col+1),x+14,y+22);ctx.save();ctx.translate(x,y+4);ctx.scale(.64,.64);const [a,b]=fighters[r*4+col];drawCombatFighter(ctx,a,1,.5);drawCombatFighter(ctx,b,1,.5);const frame=playing?Math.floor((now-start)/75+col)%4:col;if(drawCombatImpact(ctx,{type:rows[r][0],x:250,y:177,power:r===3?104:58,ttl:rows[r][2]*(1-frame/4)}))total++;ctx.restore();}const ready=isArtAssetReady('combat-impact-atlas');status.textContent=ready?total+' / 16 렌더링 정상':'에셋 불러오는 중';if(ready&&total===16){window.fxQaReady=true;document.documentElement.dataset.qa='passed';}requestAnimationFrame(render);}requestAnimationFrame(render);
</script></html>
