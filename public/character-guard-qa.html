<!doctype html><html lang="ko"><meta charset="utf-8"><title>Character guard motion v2</title><style>body{margin:0;background:#0e1420;color:#edf3ff;font:14px system-ui}header{display:flex;align-items:center;gap:22px;padding:16px 22px}h1{font-size:20px;margin:0}button{background:#203450;color:#d4f4ff;border:1px solid #54708c;border-radius:6px;padding:8px 14px}small{color:#9ab0ca}#status{margin-left:auto}canvas{display:block;width:min(1280px,100vw);height:auto}</style><header><h1>CHARACTER GUARD V2</h1><small>전체 10명 / 캐릭터별 새 원화5장 / ?group=0 또는 1</small><button id="play">재생</button><small id="status">Loading…</small></header><canvas width="1280" height="1900"></canvas><script type="module">
import{Fighter}from'/assets/combat/Fighter.js';import{getCharacter}from'/assets/game/characters.js';import{animationSequenceSample}from'/assets/render/AnimationTimingMapper.js';import{drawCombatFighter}from'/assets/render/Visuals.js';import{animationTextureManager}from'/assets/render/AnimationTextureManager.js';import{characterTextureManager}from'/assets/render/CharacterTextureManager.js';import{runtimeQuality}from'/assets/core/RuntimeQuality.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),allIds=['KEN','RYU','CHUNLI','ALEX','DUDLEY','MAKOTO','IBUKI','YUN','URIEN','GILL'],group=new URLSearchParams(location.search).get('group')==='1'?1:0,ids=allIds.slice(group*5,group*5+5),states={},actors=[];runtimeQuality.setTier('high');characterTextureManager.setMode('hd');characterTextureManager.focusCharacter(...ids);for(const id of ids){animationTextureManager.preloadCharacter(id,'movement');characterTextureManager.preloadCharacter(id);const f=new Fighter(getCharacter(id),'player',170,225,1);f.state='block';states[id]=[];for(let n=-16;n<0;n++){f.stateFrame=n;const s=animationSequenceSample(f,0);if(states[id][s.frame]===undefined)states[id][s.frame]=n;}for(const facing of [1,-1])actors.push(Array.from({length:5},()=>{const a=new Fighter(getCharacter(id),'player',170,225,facing);a.state='block';return a;}));}
let playing=false,start=performance.now();document.querySelector('#play').onclick=()=>{playing=!playing;start=performance.now();document.querySelector('#play').textContent=playing?'정지':'재생';};function render(now){ctx.fillStyle='#101724';ctx.fillRect(0,0,1280,1900);let ready=0;for(let row=0;row<10;row++){const id=ids[Math.floor(row/2)];for(let col=0;col<5;col++){const x=col*256,y=row*190;ctx.fillStyle=(row+col)%2?'#1c283b':'#172235';ctx.fillRect(x+1,y+1,254,188);ctx.fillStyle='#ccdaec';ctx.font='bold 13px system-ui';ctx.fillText(id+' '+(row%2?'LEFT':'RIGHT')+' / '+(col+1),x+12,y+21);const f=actors[row][col],frame=playing?(Math.floor((now-start)/90)+col)%5:col;f.stateFrame=states[id][frame];ctx.save();ctx.translate(x,y);ctx.scale(.75,.75);drawCombatFighter(ctx,f,1,.5);ctx.restore();if(animationTextureManager.selection(animationSequenceSample(f,0).sequence))ready++;}}document.querySelector('#status').textContent=ready+' / 50 양방향 렌더 · 그룹 '+(group+1);if(ready===50)document.documentElement.dataset.qa='passed';requestAnimationFrame(render);}requestAnimationFrame(render);
</script></html>
