<!doctype html><html lang="ko"><meta charset="utf-8"><title>Character hit motion v2</title><style>body{margin:0;background:#0e1420;color:#edf3ff;font:14px system-ui}header{display:flex;align-items:center;gap:22px;padding:16px 22px}h1{font-size:20px;margin:0}button,select{background:#203450;color:#d4f4ff;border:1px solid #54708c;border-radius:6px;padding:8px 14px}small{color:#9ab0ca}#status{margin-left:auto}canvas{display:block;width:min(2048px,100vw);height:auto}</style><header><h1>CHARACTER HIT V2</h1><small>전체10명 / 캐릭터별 새 원화8장</small><select id="group" aria-label="캐릭터 그룹"></select><button id="play">재생</button><small id="status">Loading…</small></header><canvas width="2048" height="1140"></canvas><script type="module">
import{Fighter}from'/assets/combat/Fighter.js';import{getCharacter}from'/assets/game/characters.js';import{animationSequenceSample}from'/assets/render/AnimationTimingMapper.js';import{drawCombatFighter}from'/assets/render/Visuals.js';import{animationTextureManager}from'/assets/render/AnimationTextureManager.js';import{characterTextureManager}from'/assets/render/CharacterTextureManager.js';import{runtimeQuality}from'/assets/core/RuntimeQuality.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),allIds=['IBUKI','MAKOTO','CHUNLI','KEN','RYU','ALEX','DUDLEY','YUN','URIEN','GILL'],group=Math.max(0,Math.min(3,Math.floor(Number(new URLSearchParams(location.search).get('group'))||0))),ids=allIds.slice(group*3,group*3+3),rowCount=ids.length*2,expectedCells=rowCount*8,states={},actors=[];canvas.height=rowCount*190;runtimeQuality.setTier('high');characterTextureManager.setMode('hd');characterTextureManager.focusCharacter(...ids);for(const id of ids){animationTextureManager.preloadCharacter(id,'movement');characterTextureManager.preloadCharacter(id);const f=new Fighter(getCharacter(id),'player',170,225,1);f.state='hit';f.hitAnimationDuration=24;states[id]=[];for(let n=-24;n<0;n++){f.stateFrame=n;const s=animationSequenceSample(f,0);if(states[id][s.frame]===undefined)states[id][s.frame]=n;}for(const facing of [1,-1])actors.push(Array.from({length:8},()=>{const a=new Fighter(getCharacter(id),'player',170,225,facing);a.state='hit';a.hitAnimationDuration=24;a.lastHitDirection=-facing;return a;}));}
const groupSelect=document.querySelector('#group');for(let i=0;i<Math.ceil(allIds.length/3);i++){const option=document.createElement('option');option.value=String(i);option.textContent=allIds.slice(i*3,i*3+3).join(' · ');option.selected=i===group;groupSelect.append(option);}groupSelect.onchange=()=>{location.search='?group='+groupSelect.value;};let playing=false,start=performance.now();document.querySelector('#play').onclick=()=>{playing=!playing;start=performance.now();document.querySelector('#play').textContent=playing?'정지':'재생';};function render(now){ctx.fillStyle='#101724';ctx.fillRect(0,0,2048,canvas.height);let ready=0;for(let row=0;row<rowCount;row++){const id=ids[Math.floor(row/2)];for(let col=0;col<8;col++){const x=col*256,y=row*190;ctx.fillStyle=(row+col)%2?'#1c283b':'#172235';ctx.fillRect(x+1,y+1,254,188);ctx.fillStyle='#ccdaec';ctx.font='bold 13px system-ui';ctx.fillText(id+' '+(row%2?'LEFT':'RIGHT')+' / '+(col+1),x+12,y+21);const f=actors[row][col],frame=playing?(Math.floor((now-start)/90)+col)%8:col;f.stateFrame=states[id][frame];ctx.save();ctx.translate(x,y);ctx.scale(.75,.75);drawCombatFighter(ctx,f,1,.5);ctx.restore();if(animationTextureManager.selection(animationSequenceSample(f,0).sequence))ready++;}}document.querySelector('#status').textContent=ready+' / '+expectedCells+' 양방향 렌더 · 그룹 '+(group+1);if(ready===expectedCells)document.documentElement.dataset.qa='passed';requestAnimationFrame(render);}requestAnimationFrame(render);
</script></html>
