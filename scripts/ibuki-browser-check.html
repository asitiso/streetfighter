<!doctype html><html lang="ko"><meta charset="utf-8"><title>Ibuki 대기 렌더 검증</title>
<style>body{background:#10151d;color:#eef2fa;font:16px system-ui;margin:18px}select{font:inherit;padding:8px;background:#202d40;color:#fff}canvas{display:block;width:100%;height:auto;margin-top:12px}#status{padding:10px;color:#ffdb6f}</style>
<h1>Ibuki 실제 렌더러 · 대기 동작 검증</h1><p>실제 게임 상태를 진행해 호흡 동작과 반복, 이미지 로딩과 배율을 확인합니다.</p>
<label>방향 <select id="facing"><option value="1">오른쪽</option><option value="-1">왼쪽</option></select></label><p id="status" role="status">이미지 로딩 중…</p><canvas width="1280" height="720"></canvas>
<script type="module">
import { Fighter } from './assets/combat/Fighter.js';
import { getCharacter } from './assets/game/characters.js';
import { animationSequenceSample } from './assets/render/AnimationTimingMapper.js';
import { animationTextureManager } from './assets/render/AnimationTextureManager.js';
import { characterTextureManager } from './assets/render/CharacterTextureManager.js';
import { runtimeQuality } from './assets/core/RuntimeQuality.js';
import { drawCombatFighter } from './assets/render/Visuals.js';
const def=getCharacter('IBUKI'),fighter=new Fighter(def,'player',300,460,1,def.superArts[0]);
const ctx=document.querySelector('canvas').getContext('2d'),status=document.querySelector('#status');
const input={held:()=>false,pressed:()=>false,released:()=>false};
const rules={mode:'belt',depthMovement:true,laneTolerance:54,arenaLeft:100,arenaRight:1180,arenaTop:380,arenaBottom:590};
runtimeQuality.setTier('high');characterTextureManager.setMode('hd');animationTextureManager.preloadCharacter('IBUKI','combat');
function render(){
 fighter.x=fighter.previousX=300;fighter.y=fighter.previousY=460;fighter.state='idle';fighter.stateFrame=0;fighter.airborne=false;fighter.facing=Number(document.querySelector('#facing').value);
 const frames=new Map();let previous=-1,wrapped=false;
 for(let tick=0;tick<120;tick++){const sample=animationSequenceSample(fighter,0);if(sample){if(previous===5&&sample.frame===0)wrapped=true;previous=sample.frame;if(!frames.has(sample.frame))frames.set(sample.frame,{stateFrame:fighter.stateFrame,sample});}fighter.updatePlayer(input,rules);}
 ctx.fillStyle='#10151d';ctx.fillRect(0,0,1280,720);let failures=0,index=0;
 for(const [frame,{stateFrame,sample}] of frames){const x=index%4*320,y=Math.floor(index/4)*360;ctx.fillStyle='#182331';ctx.fillRect(x+2,y+2,316,356);ctx.fillStyle='#edf4ff';ctx.font='15px system-ui';ctx.fillText(`${frame+1}/6 · 대기 · 게임 ${stateFrame}F`,x+12,y+24);
  fighter.x=fighter.previousX=x+160;fighter.y=fighter.previousY=y+340;fighter.state='idle';fighter.stateFrame=stateFrame;
  let observed=null;const draw=ctx.drawImage;ctx.drawImage=function(image,...args){if(image.src?.endsWith(sample.sequence.asset))observed={sourceWidth:args[2],destWidth:args[6],naturalWidth:image.naturalWidth};return draw.call(this,image,...args);};
  try{drawCombatFighter(ctx,fighter,0,0);}finally{ctx.drawImage=draw;}
  const valid=observed&&observed.sourceWidth===384&&observed.destWidth===192&&observed.naturalWidth===2304;if(!valid)failures++;
  ctx.fillStyle=valid?'#8ef0b3':'#ff8a8a';ctx.fillText(valid?'실제 이미지 · 동일 배율':'이미지/배율 확인 실패',x+12,y+48);index++;
 }
 const passed=frames.size===6&&wrapped&&failures===0;status.textContent=`${passed?'PASS':'FAIL'} · IBUKI IDLE · ${frames.size}/6 프레임 · 반복 ${wrapped} · 렌더 실패 ${failures}`;document.body.dataset.verdict=passed?'pass':'fail';
}
const started=performance.now();function ready(){if(animationTextureManager.readyCount('IBUKI')===1){render();return;}if(performance.now()-started>10000){status.textContent='FAIL · 이미지 로딩 제한 시간 초과';return;}requestAnimationFrame(ready);}ready();document.querySelector('#facing').addEventListener('change',render);
</script></html>
